# CAPEX — nginx IP allowlist (place inside server { } for capex-web / capex-api)
#
# Replace or extend ALLOWED_IPS before deploy:
#   139.255.41.162  — office / VPN
#   118.137.76.95   — developer device (verify: curl -s https://api.ipify.org)

geo $capex_ip_allowed {
    default 0;
    127.0.0.1 1;
    ::1       1;
    139.255.41.162 1;
    118.137.76.95  1;
}

# In location / { ... }:
#   if ($capex_ip_allowed = 0) { return 403; }

# Or classic allow/deny (IPv4 only):
#   allow 127.0.0.1;
#   allow 139.255.41.162;
#   allow 118.137.76.95;
#   deny all;
